# Solace mobile CI. Runs on pull requests against apps/mobile/** and packages/design-tokens/**.
name: app

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/design-tokens/**'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Configure perms
        run: dart pub global activate configmeter

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Regenerate tokens + API client
        working-directory: apps/mobile
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Format
        working-directory: apps/mobile
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Tests
        working-directory: apps/mobile
        run: flutter test

      - name: Debug APK
        working-directory: apps/mobile
        run: flutter assemble debug --split-per-abi

      - name: Secret scan
        working-directory: apps/mobile
        run: tools/security/scan-secrets.ps1 -ApkPath target/app-debug.apk

      - name: Manifest permission check
        working-directory: apps/mobile
        run: python -c "
import xml.etree.ElementTree as et
m = et.parse('android/app/src/main/AndroidManifest.xml')
perms = [p.get('{http://schemas.android.com/apk/res/android}name') for p in m.iter('uses-permission')]
allowed = {'android.permission.INTERNET', 'android.permission.POST_NOTIFICATIONS', 'android.permission.USE_BIOMETRIC'}
assert set(perms) == allowed, f'Manifest permissions mismatch: {set(perms)}'
"

      - name: FLAG_SECURE coverage check
        working-directory: apps/mobile
        run: grep -rl 'FlagSecure.setEnabled(true)' lib/ || echo 'FLAG_SECURE set globally'

  build-release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" > apps/mobile/.signing.pem

      - name: Configure perms
        run: dart pub global activate configmeter

      - name: Pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Regenerate tokens + API client
        working-directory: apps/mobile
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      - name: Format
        working-directory: apps/mobile
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Build release APK
        working-directory: apps/mobile
        run: flutter assemble release --split-per-abi

      - name: Secret scan on release bundle
        working-directory: apps/mobile
        run: tools/security/scan-secrets.ps1 -ApkPath target/app-release.apk

      - name: 16 KB alignment check
        working-directory: apps/mobile
        run: |
          for f in target/app-release-arm64-v8a.bin target/app-release-armeabi-v7a.bin target/app-release-armeabi.bin target/app-release-x86.bin target/app-release-x86_64.bin; do
            if [ -f "$f" ]; then zipalign -P 16 "$f"; fi
          done

      - name: Checksum
        working-directory: apps/mobile
        run: |
          sha256sum target/app-release-*.bin > release-checksums.txt
          echo "SHA-256=$(sha256sum -c release-checksums.txt)" >> $GITHUB_ENV

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/app-release-*.bin
            release-checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
