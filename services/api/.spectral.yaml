extends:
  - spectral:oas

rules:
  # Every operation must be identifiable in generated clients and traces.
  operation-operationId: error
  operation-operationId-unique: error
  operation-tags: error
  # Summary is required (see Solace-operation-summary); a full prose
  # description is encouraged but not a gate.
  operation-description: off

  # The contract is the client interface. Every response must be described.
  operation-success-response: error
  oas3-valid-media-example: error
  oas3-valid-schema-example: error
  no-eval-in-markdown: error
  no-script-tags-in-markdown: error

  # Solace-specific: every path starts with /v1 except health probes.
  Solace-paths-versioned:
    description: All business endpoints live under /v1. Health probes do not.
    given: $.paths[*]~
    severity: error
    then:
      function: pattern
      functionOptions:
        match: '^(/health|/ready|/v1/.+)$'

  # Every operation carries an explicit summary for the generated reference.
  Solace-operation-summary:
    description: Every operation needs a summary.
    given: $.paths[*][get,put,post,delete,patch]
    severity: error
    then:
      field: summary
      function: truthy

  # Sensitive free-text fields must declare a bound, so a client cannot send
  # unbounded content into an encrypted column.
  Solace-bounded-text:
    description: Journal and safety-plan text fields must have a maxLength.
    given: $..properties[text,field1,field2,field3,field4,field5]
    severity: error
    then:
      field: maxLength
      function: truthy
