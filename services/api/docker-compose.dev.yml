# Local development dependencies. Not for production.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: Solace-postgres
    environment:
      POSTGRES_USER: Solace
      POSTGRES_PASSWORD: Solace
      POSTGRES_DB: Solace
    ports:
      - '5432:5432'
    volumes:
      - Solace-pgdata:/var/lib/postgresql/data
      - ./scripts/init-dev-db.sql:/docker-entrypoint-initdb.d/10-init-dev-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U Solace -d Solace']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: Solace-redis
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '6379:6379'
    volumes:
      - Solace-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  Solace-pgdata:
  Solace-redisdata:
